name: lojapet

x-jwt: &jwt
  JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no .env da raiz}
  JWT_ISSUER: petshop-auth

x-rabbit-url: &rabbit-url amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F

services:
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Configure RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Configure RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  auth:
    build: ./microsservicos/auth
    image: lojapet/auth:entrega4
    environment:
      <<: *jwt
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-30}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?Configure AUTH_ADMIN_PASSWORD}
      AUTH_USER_PASSWORD: ${AUTH_USER_PASSWORD:?Configure AUTH_USER_PASSWORD}
    volumes:
      - auth_data:/data
    restart: unless-stopped

  cadastros:
    build: ./microsservicos/cadastros
    image: lojapet/cadastros:entrega4
    environment:
      <<: *jwt
      DATABASE_URL: sqlite:////data/cadastros.db
      RABBITMQ_URL: *rabbit-url
    volumes:
      - cadastros_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  cadastros-outbox:
    build: ./microsservicos/cadastros
    image: lojapet/cadastros:entrega4
    command: ["python", "-u", "outbox_worker.py"]
    environment:
      DATABASE_URL: sqlite:////data/cadastros.db
      RABBITMQ_URL: *rabbit-url
    volumes:
      - cadastros_data:/data
    healthcheck:
      disable: true
    depends_on:
      rabbitmq:
        condition: service_healthy
      cadastros:
        condition: service_healthy
    restart: unless-stopped

  agendamentos:
    build: ./microsservicos/agendamentos
    image: lojapet/agendamentos:entrega4
    environment:
      <<: *jwt
      AGENDAMENTOS_DATABASE_URL: sqlite:////data/agendamentos.db
      CADASTROS_URL: http://cadastros:8081
      RABBITMQ_URL: *rabbit-url
    volumes:
      - agendamentos_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  loja:
    build:
      context: .
      dockerfile: microsservicos/loja/Dockerfile
    image: lojapet/loja:entrega4
    deploy:
      replicas: 3
    environment:
      <<: *jwt
      HOST: 0.0.0.0
      PORT: 8082
      DB_DRIVER: sqlite
      SQLITE_PATH: /data/loja.db
      TAXA_ENTREGA: "10.00"
      CADASTROS_URL: http://cadastros:8081
    volumes:
      - loja_data:/data
    restart: unless-stopped

  loja-consumer:
    build:
      context: .
      dockerfile: microsservicos/loja/Dockerfile
    image: lojapet/loja:entrega4
    command: ["node", "dist/consumer.js"]
    environment:
      DB_DRIVER: sqlite
      SQLITE_PATH: /data/loja.db
      RABBITMQ_URL: *rabbit-url
    volumes:
      - loja_data:/data
    healthcheck:
      disable: true
    depends_on:
      rabbitmq:
        condition: service_healthy
      loja:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      - auth
      - cadastros
      - agendamentos
      - loja
    restart: unless-stopped

volumes:
  rabbitmq_data:
  auth_data:
  cadastros_data:
  agendamentos_data:
  loja_data:

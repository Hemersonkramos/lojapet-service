worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format gateway '$remote_addr [$time_local] "$request" status=$status '
                       'upstream=$upstream_addr upstream_status=$upstream_status '
                       'tempo=$request_time id=$request_id';
    access_log /dev/stdout gateway;
    error_log  /dev/stderr warn;

    server_tokens off;
    client_max_body_size 1m;

    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream auth_server {
        zone auth_server 64k;
        server auth:8000 resolve;
    }

    upstream cadastros_service {
        zone cadastros_service 64k;
        server cadastros:8081 resolve;
    }

    upstream agendamentos_service {
        zone agendamentos_service 64k;
        server agendamentos:8083 resolve;
    }

    upstream loja_cluster {
        zone loja_cluster 64k;
        server loja:8082 resolve max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 80;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        proxy_connect_timeout 2s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        add_header X-Upstream $upstream_addr always;

        location = / {
            default_type application/json;
            return 200 '{"gateway":"nginx","rotas":["/api/auth/","/api/cadastros/","/api/loja/","/api/agendamentos/"]}';
        }

        location /api/auth/ {
            proxy_pass http://auth_server/;
        }

        location /api/cadastros/ {
            proxy_pass http://cadastros_service/;
        }

        location /api/agendamentos/ {
            proxy_pass http://agendamentos_service/;
        }

        location /api/loja/ {
            proxy_pass http://loja_cluster/;
        }

        location / {
            default_type application/json;
            return 404 '{"erro":"Rota não encontrada no gateway"}';
        }
    }
}
